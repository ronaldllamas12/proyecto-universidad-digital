name: Test Maintainability

on:
  push:
    paths:
      - "backend/tests/**"
      - "frontend/tests/**"
      - "frontend/cypress/**"
      - ".github/workflows/test-maintainability.yml"
      - ".jscpd.json"
  pull_request:
    paths:
      - "backend/tests/**"
      - "frontend/tests/**"
      - "frontend/cypress/**"
      - ".github/workflows/test-maintainability.yml"
      - ".jscpd.json"

jobs:
  maintainability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install radon
        run: python -m pip install --upgrade pip radon

      - name: Complexity report (backend tests)
        run: radon cc backend/tests -s -a

      - name: Duplication report (frontend tests + cypress)
        run: npx jscpd@4.0.5 --config .jscpd.json
