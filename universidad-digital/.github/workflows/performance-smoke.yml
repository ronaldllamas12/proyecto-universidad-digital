name: Performance Profiles

on:
  push:
    paths:
      - "universidad-digital/backend/**"
      - "universidad-digital/.github/workflows/performance-smoke.yml"
  pull_request:
    paths:
      - "universidad-digital/backend/**"
      - "universidad-digital/.github/workflows/performance-smoke.yml"
  workflow_dispatch:

jobs:
  performance-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: universidad-digital/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fast performance profile (PR)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python -m pytest tests/performance -m "performance and not stress" --no-cov -q -s | tee performance-fast-report.txt

      - name: Run full performance profile (push/manual)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          python -m pytest tests/performance -m performance --no-cov -q -s | tee performance-full-report.txt

      - name: Upload performance reports
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: |
            universidad-digital/backend/performance-fast-report.txt
            universidad-digital/backend/performance-full-report.txt
          if-no-files-found: warn
