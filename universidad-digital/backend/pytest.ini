[pytest]
# Ubicación de los tests
testpaths = tests

# Patrones para descubrir archivos y funciones de test
python_files = test_*.py *_test.py
# Clases de test deben empezar por 'Test' (TestSecurity, TestUsersAPI, etc.)
python_classes = Test*
python_functions = test_*




# Opciones por defecto para la línea de comandos
# -sv: modo "short" y "verbose"
# --cov=app: activa la cobertura para el directorio 'app'
# --cov-report=term-missing: muestra un reporte de cobertura en la terminal
# -r fE: muestra un resumen de los tests fallidos y con errores
# Umbral de cobertura objetivo empresarial/académico.
addopts = -sv --strict-markers --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85 -r fE

# Ruta raíz del código fuente para resolver imports
# Le dice a pytest que añada el directorio actual (.) a las rutas de búsqueda de Python
pythonpath = .

# Modo de detección de asyncio para tests asíncronos
asyncio_mode = auto

# Definición de marcadores (markers) personalizados para categorizar tests
# Esto permite ejecutar selectivamente ciertos tipos de pruebas, ej: pytest -m unit
markers =
    unit: Tests unitarios (rápidos y aislados)
    integration: Tests de integración (requieren servicios externos como BD)
    e2e: Tests End-to-End (flujos completos de usuario)
    smoke: Un subconjunto pequeño de tests críticos para validar un despliegue
    regression: Tests que comprueban que bugs antiguos no reaparecen
    security: Tests de seguridad (inyecciones, accesos indebidos)
    db: Tests que tocan la base de datos directamente
