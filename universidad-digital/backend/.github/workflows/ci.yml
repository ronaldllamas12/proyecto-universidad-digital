# .github/workflows/ci.yml
# Nombre del workflow que se mostrará en la pestaña "Actions" de GitHub
name: Backend CI - Build, Lint, and Test

# --- Disparadores del Workflow ---
# Este workflow se ejecutará en 'push' a las ramas 'main' y 'develop',
# y en cada 'pull request' dirigido a esas ramas.
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# --- Trabajos (Jobs) ---
# Un workflow se compone de uno o más jobs que se ejecutan en paralelo o secuencialmente
jobs:
  build-and-test:
    # Nombre del job
    name: Build and Test

    # Entorno de ejecución: la última versión de Ubuntu
    runs-on: ubuntu-latest

    # Directorio de trabajo por defecto para los comandos del backend
    defaults:
      run:
        working-directory: ./universidad-digital/backend

    # Pasos (Steps) que componen el job
    steps:
      # 1. Checkout del código
      # Descarga el código del repositorio en el runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configuración de Python
      # Instala la versión de Python especificada
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip' # Activa el caché para las dependencias de pip

      # 3. Instalación de dependencias
      # Instala todas las librerías listadas en requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Ejecución de Linters (Paso de Calidad de Código)
      # Un buen CI debe verificar el estilo y la calidad del código antes de los tests.
      # Aquí irían herramientas como flake8, ruff, black o mypy.
      - name: Run Linters (e.g., Ruff)
        run: |
          # pip install ruff
          # ruff check .
          echo "Ejecutando linter (simulado)..." # Placeholder

      # 5. Ejecución de la suite de Pruebas con Cobertura
      # Ejecuta pytest y le pide que mida la cobertura.
      # El comando utiliza los umbrales definidos en .coveragerc para decidir si fallar.
      # Si la cobertura es menor a 85%, este paso fallará y, con él, todo el pipeline.
      - name: Run tests with coverage check
        run: pytest --cov-report=html --cov

      # 6. Subida del artefacto de cobertura
      # Si los tests pasan, este paso sube el reporte de cobertura HTML generado
      # como un "artefacto" del build. Esto permite descargarlo desde GitHub
      # para inspeccionar visualmente qué partes del código no están cubiertas.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report # Nombre del artefacto
          path: universidad-digital/backend/coverage_html_report # Ruta al directorio del reporte
          if-no-files-found: error # Falla si el reporte no se encuentra
