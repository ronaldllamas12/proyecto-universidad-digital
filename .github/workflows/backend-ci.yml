jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: universidad-digital/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        working-directory: universidad-digital/backend
        run: |
          ruff check app tests

      - name: Validate versioned test datasets
        working-directory: universidad-digital/backend
        run: |
          python scripts/validate_test_datasets.py

      - name: Run tests with coverage gate
        working-directory: universidad-digital/backend
        run: |
          python -m pytest -q

      - name: Generate coverage dashboard by module
        working-directory: universidad-digital/backend
        run: |
          python scripts/generate_module_coverage_dashboard.py

      - name: Upload coverage dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-by-module
          path: universidad-digital/docs/TEST_COVERAGE_BY_MODULE_DASHBOARD.md
