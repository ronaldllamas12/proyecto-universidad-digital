name: Staging Equivalence Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 3"

jobs:
  staging-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skip when staging secrets are missing
        if: ${{ secrets.STAGING_API_BASE_URL == '' }}
        run: echo "Skipping staging smoke: STAGING_API_BASE_URL is not configured."

      - name: Run staging equivalence smoke
        if: ${{ secrets.STAGING_API_BASE_URL != '' }}
        working-directory: universidad-digital/backend
        env:
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          STAGING_FRONTEND_URL: ${{ secrets.STAGING_FRONTEND_URL }}
          EXPECTED_CORS_ORIGIN: ${{ secrets.EXPECTED_CORS_ORIGIN }}
        run: |
          python scripts/staging_equivalence_smoke.py

      - name: Upload staging equivalence report
        if: ${{ secrets.STAGING_API_BASE_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: staging-equivalence-report
          path: universidad-digital/backend/staging-equivalence-report.md
