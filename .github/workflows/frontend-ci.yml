name: Frontend CI

on:
  push:
    paths:
      - "universidad-digital/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "universidad-digital/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

jobs:
  test-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: universidad-digital/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: universidad-digital/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit+interaction+functional tests with coverage gate
        run: npx vitest run --coverage
