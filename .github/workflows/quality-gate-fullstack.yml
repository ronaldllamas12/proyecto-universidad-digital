name: Quality Gate Fullstack

on:
  push:
    paths:
      - "universidad-digital/backend/**"
      - "universidad-digital/frontend/**"
      - "universidad-digital/checklists_por_capas/**"
      - ".github/workflows/quality-gate-fullstack.yml"
  pull_request:
    paths:
      - "universidad-digital/backend/**"
      - "universidad-digital/frontend/**"
      - "universidad-digital/checklists_por_capas/**"
      - ".github/workflows/quality-gate-fullstack.yml"
  workflow_dispatch:

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universidad-digital/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint backend
        run: ruff check app tests

      - name: Validate versioned test datasets
        run: python scripts/validate_test_datasets.py

      - name: Run backend tests with coverage gate
        run: python -m pytest -q

      - name: Generate backend coverage dashboard by module
        run: python scripts/generate_module_coverage_dashboard.py

      - name: Upload backend coverage dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-by-module
          path: universidad-digital/docs/TEST_COVERAGE_BY_MODULE_DASHBOARD.md

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universidad-digital/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: universidad-digital/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests with coverage gate
        run: npx vitest run --coverage

  test-maintainability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install radon
        run: python -m pip install --upgrade pip radon

      - name: Complexity report (backend tests)
        run: radon cc universidad-digital/backend/tests -s -a

      - name: Duplication report (frontend tests + cypress)
        run: npx jscpd@4.0.5 --config universidad-digital/.jscpd.json

  quality-gate:
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - frontend-quality
      - test-maintainability
    steps:
      - name: Quality gate summary
        run: echo "Full-stack quality gate passed (backend + frontend + maintainability)."
