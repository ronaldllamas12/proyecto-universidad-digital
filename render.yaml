services:
  - type: web
    name: universidad-digital-api
    runtime: python
    rootDir: universidad-digital/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_API_TITLE
        value: Universidad Digital API
      - key: APP_API_VERSION
        value: 1.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: universidad-digital-db
          property: connectionString
      - key: APP_JWT_SECRET
        sync: false
      - key: APP_CORS_ORIGINS
        value: '["https://proyecto-universidad-digital.onrender.com","https://universidad-digital.onrender.com"]'
      - key: APP_COOKIE_SAMESITE
        value: none
      - key: PYTHON_VERSION
        value: 3.12.8

  - type: web
    name: universidad-digital-frontend
    runtime: static
    rootDir: universidad-digital/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: universidad-digital-db
    databaseName: universidad_digital
    user: universidad_digital_user
